name: JelloBrain gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python gates.py
      - run: python dialogue_gates.py
      - run: python spatial_gates.py
      - run: python salience_gates.py
      - run: python poke_gates.py
      - run: python crossing_gates.py
      - run: python robustness_gates.py
      - run: python assurance_gates.py
